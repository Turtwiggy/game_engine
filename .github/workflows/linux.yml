name: linux_build

on:
  push:
    branches: ["*"]

jobs:
  build-game:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        include:
          - os: ubuntu-22.04
            vcpkg-response-file: vcpkg-x64-linux.txt
            triplet: x64-linux

    env:
      VCPKG_ROOT: ${{ github.workspace }}/thirdparty/vcpkg
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/thirdparty/vcpkg/installed

    steps:
      - uses: lukka/get-cmake@latest
        with:
            cmakeVersion: "~3.30.0" 

      - uses: actions/checkout@v3
        with:
          submodules: true

      # See Readme.md: Linux
      - name: install-linux-deps
        run: |
          sudo apt-get update 
          sudo apt-get -y install
            build-essential \
            curl zip unzip tar pkg-config
            libglew-dev libxmu-dev libxi-dev libgl-dev
          sudo apt install autoconf libtool linux-libc-dev -y
          sudo apt install libglu1-mesa-dev freeglut3-dev mesa-common-dev -y
          sudo apt install libsdl2-dev libsdl2-2.0-0 -y
          sudo apt install python3-jinja2 -y
      - name: Restore artifacts, or setup vcpkg for building artifacts
        uses: lukka/run-vcpkg@v10
        id: runvcpkg-linux
        with:
          vcpkgDirectory: "${{ github.workspace }}/thirdparty/vcpkg"
          vcpkgJsonGlob: "**/game_survivors_tests/vcpkg.json"
          runVcpkgInstall: true

      - name: get-linux-compiler
        run: |
          g++ --version
          which g++
          cmake --version

      - name: configure-linux
        run: |
          mkdir build
          cmake --no-warn-unused-cli -DCMAKE_C_COMPILER=/usr/bin/gcc -DCMAKE_CXX_COMPILER=/usr/bin/g++ -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=TRUE -DCMAKE_BUILD_TYPE:STRING=Release -S . -B build -G Ninja

      - name: build-tests
        run: cmake --build build --config Release --target game_survivors_tests

      - name: build-game
        run: cmake --build build --config Release --target game_survivors

      - name: copy-game-assets
        run: |
          cp -r ${{ github.workspace }}/game_survivors/assets ./build/game_survivors/
          rm -r ./build/game_survivors/CMakeFiles
          rm ./build/game_survivors/*.cmake || true
          rm ./build/game_survivors/*.manifest || true
          chmod +x ./build/game_survivors/solar_warfare

      - name: release-game
        uses: actions/upload-artifact@v4
        with:
          name: game_survivors-${{ matrix.os }}
          path: ./build/game_survivors
